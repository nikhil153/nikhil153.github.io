{{ define "main" }}
    <h1>{{ .Title | safeHTML }}</h1>
    {{ .Content }}
    <div class="tiles">
        {{ range .Params.projects }}
        <a class="tile" href="{{ .url }}">
            <h3>{{ .name }}</h3>
            <p>{{ .description }}</p>
        </a>
        {{ end }}
    </div>
{{ end }}
