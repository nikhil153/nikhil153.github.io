baseURL = "https://nikhil153.github.io/"
languageCode = "en-us"
title = "Nikhil Bhagwat"
theme = "barks"
disableKinds = ["taxonomy", "term"]

[params.head]
    author = "Nikhil Bhagwat"
    description = "Computational neuroscientist working on neuroinformatics, reproducible neuroimaging and machine learning."
    keywords = ["neuroimaging", "neuroinformatics", "machine learning", "reproducibility", "open science"]
    custom_css = "/css/custom.css"

# Profile picture shown next to the name in the header (layouts/partials/header.html)
[params.header]
    image = "/images/NB_GH_pic.jpeg"
    subtitle = "Computational Neuroscientist · ORIGAMI Lab, McGill University"

